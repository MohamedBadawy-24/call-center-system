# ──────────────────────────────────────────────────────────────────
# Baseera Call Center System — CI Pipeline
# ──────────────────────────────────────────────────────────────────
# Triggers on push/PR to master.
#
# Jobs:
#   1. unit-integration  – Backend Jest (170 tests) + Frontend Vitest (31 tests)
#   2. e2e-playwright    – Full Playwright E2E suite (4 specs, sequential)
#
# Database strategy:
#   • Backend Jest tests spin up their own MongoMemoryReplSet in-process
#     (see tests/globalSetup.js), so they need NO external MongoDB service.
#   • Playwright E2E tests need a real MongoDB replica set. We start one
#     manually via Docker with explicit localhost member host binding.
# ──────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_ENV: test

jobs:
  # ────────────────────────────────────────────────
  # Job 1: Unit & Integration Tests
  # ────────────────────────────────────────────────
  unit-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js Setup ──
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      # ── Install Dependencies ──
      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: admin-ui

      # ── Backend Jest Tests ──
      # Uses mongodb-memory-server internally — no external DB needed.
      - name: Run backend Jest tests
        run: npm test

      # ── Frontend Vitest Tests ──
      - name: Run frontend Vitest tests
        run: npm run test:ui

  # ────────────────────────────────────────────────
  # Job 2: E2E Playwright Tests
  # ────────────────────────────────────────────────
  e2e-playwright:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit-integration  # Only run E2E if unit tests pass

    env:
      MONGO_URI: mongodb://localhost:27017/baseera_e2e?replicaSet=rs0
      JWT_SECRET: ci-e2e-jwt-secret-key-1234567890
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: test
      E2E_BACKEND_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js Setup ──
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      # ── Install Dependencies ──
      - name: Install backend dependencies
        run: npm ci

      # ── Start MongoDB Replica Set ──
      - name: Start MongoDB Replica Set
        run: |
          docker run -d -p 27017:27017 --name mongo mongo:7 mongod --replSet rs0
          echo "Waiting for MongoDB to accept connections..."
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand({ping:1})" >/dev/null 2>&1; then
              echo "MongoDB is accepting connections."
              break
            fi
            echo "Attempt $i: MongoDB not ready yet..."
            sleep 2
          done
          echo "Initiating replica set..."
          docker exec mongo mongosh --eval 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })'
          echo "Waiting for replica set to elect primary..."
          for i in $(seq 1 15); do
            IS_PRIMARY=$(docker exec mongo mongosh --quiet --eval "rs.isMaster().ismaster" 2>/dev/null || echo "false")
            if [ "$IS_PRIMARY" = "true" ]; then
              echo "Replica set primary elected!"
              break
            fi
            echo "Attempt $i: Waiting for primary election..."
            sleep 2
          done

      - name: Install frontend dependencies
        run: npm ci
        working-directory: admin-ui

      # ── Install Playwright Browsers ──
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Build Frontend for Serving ──
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_SOCKET_URL: http://localhost:3000
        working-directory: admin-ui

      # ── Start Backend Server ──
      - name: Start backend server
        run: |
          NODE_ENV=test node server.js > backend.log 2>&1 &
          echo "Waiting for backend to be ready (polling /auth/has-users)..."
          for i in $(seq 1 60); do
            if curl -sS --fail http://localhost:3000/auth/has-users > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Backend failed to start within 120 seconds."
              echo "=== Backend Logs ==="
              cat backend.log
              exit 1
            fi
            echo "Attempt $i: backend not ready yet..."
            sleep 2
          done

      # ── Serve Frontend Build ──
      - name: Serve frontend build
        run: |
          npx -y serve -s dist -l 3001 &
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 15); do
            if curl -s http://localhost:3001 > /dev/null 2>&1; then
              echo "Frontend is ready!"
              break
            fi
            echo "Attempt $i: frontend not ready yet..."
            sleep 2
          done
        working-directory: admin-ui

      - name: Wait for backend and frontend to be ready
        run: npx wait-on http://localhost:3000/health http://localhost:3001 --timeout 60000

      # ── Run Playwright E2E Tests ──
      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium --workers=1

      # ── Upload Artifacts on Failure ──
      - name: Upload Playwright report and backend logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            backend.log
          retention-days: 14

version: '3.8'

services:
  # Node.js backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      - ./uploads:/app/uploads

  # Frontend Nginx server (exposed on host port 80)
  frontend:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
